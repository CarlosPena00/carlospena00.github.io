<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<head>
    <title>Carlos Pena</title>
    <script>
        // Apply saved theme before paint to avoid a flash. Dark is the default.
        (function () {
            try {
                var t = localStorage.getItem("theme");
                document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="stylesheet" type="text/css" href="{{ '/assets/style.css' | relative_url }}">
</head>

<body>

    <header>
        <nav>
            <div class="brand">
                <span class="logo"><a href="/">Carlos Pena</a></span>
                <button type="button" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
            </div>
            <ul class="navigation">
                <li><a href="https://carlospena.com.br/kana-training/">Kana</a></li>
                {% assign sorted = site.pages | sort: 'order' %}
                {% for page in sorted %}
                {% if page.title and page.title != 'Home' %}
                <li><a href="{{ site.baseurl }}{{ page.url }}">{{ page.title }}</a></li>
                {% endif %}
                {% endfor %}
            </ul>
        </nav>
    </header>

    {{ content }}

    <script>
        // Theme toggle: switches between dark (default) and light, persisted in localStorage.
        (function () {
            var btn = document.querySelector(".theme-toggle");
            if (!btn) return;
            function label() {
                var dark = document.documentElement.getAttribute("data-theme") !== "light";
                btn.textContent = dark ? "🌙" : "☀️";
                btn.title = dark ? "Switch to light mode" : "Switch to dark mode";
            }
            label();
            btn.addEventListener("click", function () {
                var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", next);
                try { localStorage.setItem("theme", next); } catch (e) {}
                label();
            });
        })();
    </script>
</body>

</html>
